<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14122a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>月夜狼人殺</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐺</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-night">
  <div class="sky" aria-hidden="true"><div class="moon"></div></div>

  <!-- 首頁 -->
  <section id="home" class="screen">
    <div class="home-card">
      <div class="logo">🐺</div>
      <h1>月夜狼人殺</h1>
      <p class="sub">手機、電腦都能玩的線上狼人殺</p>
      <label class="field">
        <span>你的暱稱</span>
        <input id="nameInput" maxlength="12" placeholder="例如：小明" autocomplete="nickname" />
      </label>
      <button class="btn primary big" data-action="create">建立新房間</button>
      <div class="or"><span>或加入朋友的房間</span></div>
      <div class="join-row">
        <input id="codeInput" inputmode="numeric" maxlength="4" placeholder="4 位數房號" />
        <button class="btn" data-action="join">加入</button>
        <button class="btn" data-action="join" data-spectator="1" title="只看不玩">👀 旁觀</button>
      </div>
      <button class="btn link-btn" data-action="rules">📖 遊戲規則與角色介紹</button>
    </div>
  </section>

  <!-- 遊戲畫面（大廳也在這裡） -->
  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="room-tag">房號 <b id="roomCode">----</b></div>
      <div class="phase" id="phaseLabel"></div>
      <div class="timer" id="timer"></div>
      <div class="top-actions">
        <button class="icon-btn" data-action="rules" title="遊戲規則" aria-label="遊戲規則">📖</button>
        <button class="icon-btn" id="soundBtn" data-action="sound" title="旁白語音">🔈</button>
        <button class="icon-btn" data-action="leave" title="離開房間">離開</button>
      </div>
    </header>

    <div class="layout">
      <main class="stage">
        <div id="banner" class="banner"></div>
        <div id="setupBar" class="setup-bar hidden"></div>
        <div id="voiceBar" class="voice-bar"></div>
        <div id="myRole" class="my-role"></div>
        <div id="lobbyPanel"></div>
        <div id="players" class="players"></div>
        <div id="specList" class="spec-list"></div>
        <div id="actions" class="actions"></div>
      </main>

      <aside class="side">
        <div class="tabs">
          <button class="tab active" data-tab="chat">聊天 <i id="unread" class="badge hidden"></i></button>
          <button class="tab" data-tab="log">遊戲紀錄</button>
        </div>
        <div class="panel" id="chatPanel">
          <div id="chatList" class="chat-list"></div>
          <form id="chatForm" class="chat-form">
            <span id="chatCh" class="ch-tag"></span>
            <input id="chatInput" maxlength="200" placeholder="輸入訊息…" autocomplete="off" />
            <button class="btn small">送出</button>
          </form>
        </div>
        <div class="panel hidden" id="logPanel">
          <div id="logList" class="log-list"></div>
        </div>
      </aside>
    </div>
  </section>

  <!-- 規則頁 -->
  <section id="rulesPage" class="rules-page hidden" role="dialog" aria-label="遊戲規則">
    <div class="rules-inner">
      <div class="rules-head">
        <h2>📖 遊戲規則</h2>
        <button class="btn small" data-action="closeRules">關閉</button>
      </div>
      <div id="rulesBody"></div>
      <button class="btn big" data-action="closeRules">回到遊戲</button>
    </div>
  </section>

  <div id="toast" class="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="voice.js"></script>
  <script src="deal.js"></script>
  <script src="app.js"></script>
</body>
</html>
