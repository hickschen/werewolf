# 月夜狼人殺：QNAP / Synology / 任何有 Docker 的機器都能用
# 程式碼直接從 GitHub 下載，並且會自動更新（有人在遊戲中時會等遊戲結束才更新）。
# 在 Container Station 建立應用程式時，把這整份內容貼上即可，不需要另外複製檔案。
services:
  werewolf:
    image: node:22-alpine
    container_name: werewolf
    command:
      - sh
      - -c
      - |
        set -e
        command -v git >/dev/null || apk add --no-cache git
        if [ ! -d /app/.git ]; then
          echo "第一次啟動，從 GitHub 下載遊戲…"
          rm -rf /app && git clone --depth 1 --branch "$$GIT_BRANCH" "$$GIT_REPO" /app
        fi
        cd /app
        npm install --omit=optional --no-audit --no-fund
        exec node supervisor.js
    environment:
      - GIT_REPO=https://github.com/hickschen/werewolf.git
      - GIT_BRANCH=main
      - UPDATE_INTERVAL=180
      - PORT=3000
      - TUNNEL_METRICS=http://werewolf-tunnel:2000
    ports:
      - "3000:3000"
    restart: unless-stopped

  # Cloudflare 免費通道：自動產生一個外網網址（只要這個容器不重啟，網址就不變）
  werewolf-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: werewolf-tunnel
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://werewolf:3000
    depends_on:
      - werewolf
    restart: unless-stopped
